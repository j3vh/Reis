name: Build media timeline

on:
  push:
    branches: [main]
    paths:
      - "data/media/**"
      - "data/location-overrides.json"
      - "scripts/build_timeline.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build timeline
        run: python scripts/build_timeline.py

      - name: Commit timeline if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/timeline.json
          git diff --cached --quiet || git commit -m "Update media timeline"
          git push
