<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noordzee reis</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1d2a;
      color: #eef4f8;
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 1rem 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.6rem;
    }
    header p {
      margin: 0;
      color: #9db3c2;
      font-size: 0.95rem;
    }

    /* Wachtwoordscherm */
    #gate {
      position: fixed;
      inset: 0;
      background: #0b1d2a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    #gate.hidden {
      display: none;
    }
    #gate form {
      background: #10293b;
      border: 1px solid #23425a;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    #gate p {
      margin: 0 0 1rem;
      color: #9db3c2;
      font-size: 0.9rem;
    }
    #gate input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #3a5266;
      background: #0b1d2a;
      color: #eef4f8;
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }
    #gate button {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      border: none;
      background: #4fa3d1;
      color: #062231;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    #gate-error {
      color: #e8746f;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin: 0 0 0.5rem;
    }

    main.hidden {
      display: none;
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 0 1rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .map-frame {
      width: 100%;
      height: 55vh;
      min-height: 360px;
      border-radius: 10px;
      overflow: hidden;
      background: #10293b;
    }

    .player {
      background: #10293b;
      border: 1px solid #23425a;
      border-radius: 10px;
      padding: 1rem;
    }

    .media-view {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #06131c;
      border-radius: 8px;
      min-height: 220px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .media-view img,
    .media-view video {
      max-width: 100%;
      max-height: 50vh;
      display: block;
    }
    .media-empty {
      color: #6f8697;
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem 1rem;
    }

    .media-caption {
      text-align: center;
      color: #9db3c2;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .controls button {
      border: 1px solid #3a5266;
      background: #16324a;
      color: #eef4f8;
      border-radius: 999px;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .controls button:hover {
      background: #1c3d59;
    }
    .controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .scrubber {
      width: 100%;
      margin-bottom: 0.75rem;
      accent-color: #4fa3d1;
    }

    .settings {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #9db3c2;
      flex-wrap: wrap;
    }
    .settings input[type="range"] {
      accent-color: #4fa3d1;
    }

    footer {
      text-align: center;
      padding: 0.75rem 1rem 1.5rem;
      font-size: 0.85rem;
      color: #6f8697;
    }

    .boat-icon {
      font-size: 1.6rem;
      text-align: center;
      line-height: 1;
      filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.6));
    }
  </style>
</head>
<body>
  <div id="gate">
    <form id="gate-form">
      <p>Deze reis is alleen voor genodigden. Voer het wachtwoord in.</p>
      <p id="gate-error"></p>
      <input type="password" id="gate-password" placeholder="Wachtwoord" autocomplete="current-password" />
      <button type="submit">Bekijk de reis</button>
    </form>
  </div>

  <main class="hidden" id="app">
    <header>
      <h1>⛵ Noordzee reis</h1>
      <p>Van Schotland naar Nederland</p>
    </header>

    <div class="layout">
      <div class="map-frame" id="map"></div>

      <div class="player">
        <div class="media-view" id="media-view">
          <div class="media-empty" id="media-empty">Tijdlijn wordt geladen&hellip;</div>
        </div>
        <div class="media-caption" id="media-caption"></div>

        <input type="range" class="scrubber" id="scrubber" min="0" max="0" value="0" step="1" />

        <div class="controls">
          <button id="btn-prev" type="button" title="Stap terug">⏮</button>
          <button id="btn-play" type="button" title="Afspelen">▶</button>
          <button id="btn-next" type="button" title="Stap vooruit">⏭</button>
        </div>

        <div class="settings">
          <label for="photo-delay">Pauze bij foto's:</label>
          <input type="range" id="photo-delay" min="1" max="15" step="1" value="4" />
          <span id="photo-delay-value">4s</span>
        </div>
      </div>
    </div>

    <footer>
      Route en momenten reconstrueren we uit de locatie- en tijdgegevens van de geuploade foto's en video's.
    </footer>
  </main>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="gate.js"></script>
  <script src="app.js"></script>
</body>
</html>
